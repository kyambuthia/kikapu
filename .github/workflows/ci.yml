name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Check formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needed for:"; echo "$out"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      - name: Build
        run: go build ./...

      - name: Test (race)
        run: go test -race ./...

      - name: Coverage floor (internal/platform >= 80%)
        run: |
          go test -coverprofile=coverage.out ./... >/dev/null
          pct=$(go tool cover -func=coverage.out | grep 'internal/platform' | awk '{gsub(/%/,"",$3); s+=$3; n++} END {if (n) printf "%.1f", s/n; else print 0}')
          echo "internal/platform coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p < 80) ? 1 : 0 }'

      - name: Binary help
        run: go run ./cmd/kikapu --help

      - name: Validate OpenAPI
        run: go run github.com/getkin/kin-openapi/cmd/validate@latest openapi.yaml
