openapi: 3.1.0
info:
  title: kikapu API
  description: Shopping cart service API
  version: 1.0.0
  contact:
    name: kikapu Team

servers:
  - url: http://localhost:8080
    description: Development server

paths:
  /healthz:
    get:
      summary: Health check
      description: Returns service health status
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum: [ok]
                    example: ok

  /readyz:
    get:
      summary: Readiness check
      description: Returns service readiness status
      operationId: getReady
      responses:
        '200':
          description: Service is ready

  /v1/version:
    get:
      summary: Version information
      description: Returns service version and commit information
      operationId: getVersion
      responses:
        '200':
          description: Version information
          content:
            application/json:
              schema:
                type: object
                required:
                  - version
                  - commit
                properties:
                  version:
                    type: string
                    example: "1.0.0"
                  commit:
                    type: string
                    example: "abc123"

  /v1/admin/products:
    get:
      summary: List products (admin)
      description: List all products with pagination and optional status filter. Requires admin:read scope.
      operationId: adminListProducts
      tags:
        - admin
      parameters:
        - name: status
          in: query
          description: Filter by product status
          schema:
            type: string
            enum: [draft, published, archived]
        - name: cursor
          in: query
          description: Pagination cursor
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of results (1-100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminProduct'
                  next_cursor:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create product (admin)
      description: Create a new product with variants. Requires admin:write scope and Idempotency-Key header.
      operationId: adminCreateProduct
      tags:
        - admin
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique key for idempotent requests
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProduct'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/products/{id}:
    get:
      summary: Get product (admin)
      description: Get a single product by ID. Requires admin:read scope.
      operationId: adminGetProduct
      tags:
        - admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProduct'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      summary: Update product (admin)
      description: Update product and its variants. Requires admin:write scope.
      operationId: adminUpdateProduct
      tags:
        - admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProduct'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      summary: Delete product (admin)
      description: Soft delete a product (sets status to archived). Requires admin:write scope.
      operationId: adminDeleteProduct
      tags:
        - admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Product deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Product in use (has orders)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/admin/products/{id}/stock:
    put:
      summary: Update stock level (admin)
      description: Set stock level for a variant at a location. Requires admin:write scope.
      operationId: adminUpdateStock
      tags:
        - admin
      parameters:
        - name: id
          in: path
          required: true
          description: Variant ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - location_id
                - on_hand
              properties:
                location_id:
                  type: string
                  description: Stock location identifier
                on_hand:
                  type: integer
                  minimum: 0
                  description: Total quantity on hand
      responses:
        '200':
          description: Stock level updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockLevel'
        '400':
          description: Validation error or insufficient stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/orders:
    get:
      summary: List orders (admin)
      description: List orders with pagination and filters. Requires admin:read scope.
      operationId: adminListOrders
      tags:
        - admin
      parameters:
        - name: status
          in: query
          description: Filter by order status
          schema:
            type: string
        - name: from
          in: query
          description: Filter orders from this timestamp (RFC3339)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Filter orders to this timestamp (RFC3339)
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          description: Pagination cursor
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of results (1-100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminOrder'
                  next_cursor:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/orders/{id}:
    get:
      summary: Get order (admin)
      description: Get a single order by ID. Requires admin:read scope.
      operationId: adminGetOrder
      tags:
        - admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  schemas:
    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: "invalid_input"
        message:
          type: string
          description: Human-readable error message
          example: "The request was invalid"
        request_id:
          type: string
          description: Request identifier for tracing
          example: "a1b2c3d4e5f6g7h8"

    ValidationError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum: [validation_error]
            message:
              type: string
            fields:
              type: object
              description: Field-specific validation errors
              additionalProperties:
                type: string

    ProductInput:
      type: object
      required:
        - slug
        - name
      properties:
        slug:
          type: string
          description: URL-friendly product identifier
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          maxLength: 80
          example: "wireless-mouse"
        name:
          type: string
          description: Product name
          example: "Wireless Mouse"
        status:
          type: string
          enum: [draft, published]
          default: draft
          description: Product status
        variants:
          type: array
          description: Product variants
          items:
            $ref: '#/components/schemas/VariantInput'

    VariantInput:
      type: object
      required:
        - sku
        - price
        - currency
      properties:
        sku:
          type: string
          description: Stock keeping unit
          example: "WM-BLK-001"
        price:
          type: integer
          minimum: 0
          description: Price in minor units (cents, pence, etc.)
          example: 2999
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO-4217 currency code
          example: "USD"

    AdminProduct:
      type: object
      required:
        - id
        - slug
        - name
        - status
      properties:
        id:
          type: string
          description: Unique product identifier
        slug:
          type: string
          description: URL-friendly product identifier
        name:
          type: string
          description: Product name
        status:
          type: string
          enum: [draft, published, archived]
          description: Product status
        variants:
          type: array
          description: Product variants
          items:
            $ref: '#/components/schemas/AdminVariant'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AdminVariant:
      type: object
      required:
        - id
        - product_id
        - sku
        - price
      properties:
        id:
          type: string
        product_id:
          type: string
        sku:
          type: string
        price:
          type: object
          required:
            - Value
            - Currency
          properties:
            Value:
              type: integer
              description: Amount in minor units
            Currency:
              type: string
              description: ISO-4217 currency code
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    StockLevel:
      type: object
      required:
        - variant_id
        - location_id
        - on_hand
        - reserved
      properties:
        variant_id:
          type: string
        location_id:
          type: string
        on_hand:
          type: integer
          minimum: 0
          description: Total quantity on hand
        reserved:
          type: integer
          minimum: 0
          description: Quantity reserved for pending orders

    AdminOrder:
      type: object
      required:
        - id
        - number
        - status
        - payment_status
      properties:
        id:
          type: string
        number:
          type: string
          description: Human-readable order number
        status:
          type: string
          enum: [pending, confirmed, fulfilled, cancelled, refunded]
        payment_status:
          type: string
          enum: [pending, captured, partially_refunded, refunded]
        fulfillment_status:
          type: string
          enum: [unfulfilled, fulfilled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  headers:
    X-Request-ID:
      description: Request identifier for tracing
      schema:
        type: string
    X-Content-Type-Options:
      description: Prevents MIME type sniffing
      schema:
        type: string
        enum: [nosniff]
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: API key with required scopes

security:
  - BearerAuth: []
