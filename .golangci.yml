run:
  timeout: 5m
  issues-exit-code: 1

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gocritic
    - bodyclose
    - noctx
    - unused
    - sqlclosecheck
    - gofmt
    - goimports

linters-settings:
  govet:
    enable-all: true
  errcheck:
    check-type-assertions: true
    check-blank: true
  goimports:
    local-prefixes: github.com/kyambuthia/kikapu
  gofmt:
    simplify: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
